name: Verify certificate pins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-pins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify live chain vs AppModule / NSC
        run: python3 tools/verify-certificate-pins.py --json
